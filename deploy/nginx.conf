# nginx in front of VARA (TLS from certbot / your own certificates). Put this in /etc/nginx/conf.d/vara.conf.
# Start VARA with  VARA_PUBLIC_HOST=vara.example.com  VARA_TRUST_PROXY=1  VARA_BIND=127.0.0.1

server {
    listen 80;
    server_name vara.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vara.example.com;

    ssl_certificate     /etc/letsencrypt/live/vara.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vara.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads (images, files) can be a few MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;

        # The Host header must reach VARA unchanged: it checks it against VARA_PUBLIC_HOST (DNS-rebinding defence).
        proxy_set_header Host $host;
        # OVERWRITE X-Forwarded-For with the address nginx saw; never append to what the client sent
        # (with VARA_TRUST_PROXY=1 VARA reads the last entry, which here is the only one).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live updates are Server-Sent Events: no buffering, no caching, and no read timeout on quiet streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        # WebSocket upgrade (the live preview relays websockets); harmless for everything else.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Needed once, in the http {} context (e.g. /etc/nginx/conf.d/00-upgrade.conf):
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
